name: Update M3U

on:
  schedule:
    - cron: "8 7-21 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs overlap
concurrency:
  group: update-m3u
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate playlist
        run: python generate_playlist.py

      - name: Get generated timestamp from JSON
        run: |
          if [ -f cache/hashes.json ]; then
            GENERATED=$(jq -r '
              .generated
              | if . then
                  sub("\\.[0-9]+"; "")
                  | gsub("T"; " ")
                  | gsub("Z$"; " UTC")
                else
                  empty
                end
            ' cache/hashes.json)
          else
            GENERATED=""
          fi

          if [ -z "$GENERATED" ] || [ "$GENERATED" = "null" ]; then
            echo "No generated timestamp found in JSON, fallback to current UTC time"
            GENERATED=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          fi

          echo "MADRID_TIME=$GENERATED" >> $GITHUB_ENV

      - name: Commit & push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add output/updated_playlist.m3u cache/
          git commit -m "Auto update playlist - $MADRID_TIME" || echo "No changes"
          git pull --rebase origin main
          git push

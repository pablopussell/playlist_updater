name: Update M3U

on:
  schedule:
    - cron: "24 7-21/3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate playlist
        run: python generate_playlist.py

      - name: Get generated timestamp from JSON (Madrid local time)
        run: |
          GENERATED_UTC=""
          if [ -f cache/hashes.json ]; then
            GENERATED_UTC=$(jq -r '.generated // empty' cache/hashes.json)
          fi

          if [ -n "$GENERATED_UTC" ] && [ "$GENERATED_UTC" != "null" ]; then
            MADRID_TIME=$(TZ="Europe/Madrid" date -d "$GENERATED_UTC" '+%Y-%m-%d %H:%M:%S %Z')
          else
            echo "No generated timestamp found in JSON, fallback to current Madrid time"
            MADRID_TIME=$(TZ="Europe/Madrid" date '+%Y-%m-%d %H:%M:%S %Z')
          fi

          echo "MADRID_TIME=$MADRID_TIME" >> $GITHUB_ENV

      - name: Commit & push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add output/updated_playlist.m3u cache/
          git commit -m "Auto update playlist - $MADRID_TIME" || echo "No changes"
          git pull --rebase origin main
          git push

name: Update M3U
 
on:
  schedule:
    - cron: "8 7-21 * * *"
  workflow_dispatch:
 
permissions:
  contents: write
 
# Never let two runs overlap (each run now starts a Kubo node)
concurrency:
  group: update-m3u
  cancel-in-progress: false
 
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
 
    env:
      KUBO_VERSION: v0.39.0
      IPNS_KEYS: >-
        k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr
        k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs
 
    steps:
      - name: Checkout
        uses: actions/checkout@v6
 
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
 
      - name: Install deps
        run: pip install -r requirements.txt
 
      - name: Install Kubo
        id: install
        continue-on-error: true   # if this fails, the script still runs via gateways/cache
        run: |
          FILE="kubo_${KUBO_VERSION}_linux-amd64.tar.gz"
          URLS=(
            "https://github.com/ipfs/kubo/releases/download/${KUBO_VERSION}/${FILE}"
            "https://dist.ipfs.tech/kubo/${KUBO_VERSION}/${FILE}"
          )
          for URL in "${URLS[@]}"; do
            echo "Downloading $URL"
            if wget -q --tries=3 --timeout=30 --waitretry=5 -O "$FILE" "$URL" && tar tzf "$FILE" > /dev/null 2>&1; then
              OK=1
              break
            fi
            echo "Download failed from $URL"
            rm -f "$FILE"
          done
          [ "${OK:-0}" = "1" ] || { echo "Could not download Kubo"; exit 1; }
          tar xzf "$FILE"
          sudo ./kubo/install.sh
          ipfs --version
 
      - name: Start IPFS daemon
        id: start
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          ipfs init --profile=lowpower
          nohup ipfs daemon > ipfs-daemon.log 2>&1 &
 
          # Wait for the API to come up (max ~60s)
          for i in $(seq 1 30); do
            if ipfs id > /dev/null 2>&1; then
              echo "Daemon is up"
              break
            fi
            sleep 2
          done
 
          ipfs id > /dev/null 2>&1 || { echo "Daemon failed to start"; exit 1; }
 
          # Give it time to connect to peers (max ~60s)
          for i in $(seq 1 30); do
            PEERS=$(ipfs swarm peers 2>/dev/null | wc -l)
            echo "Connected peers: $PEERS"
            [ "$PEERS" -ge 10 ] && break
            sleep 2
          done
 
      - name: Fetch playlists via Kubo
        if: steps.start.outcome == 'success'
        continue-on-error: true   # the script falls back to gateways, then the cache
        run: |
          mkdir -p downloads
          for FILE in hashes.m3u; do
            DONE=0
            for KEY in $IPNS_KEYS; do
              for ATTEMPT in 1 2; do
                echo "Fetching $FILE from ${KEY:0:12}... (attempt $ATTEMPT)"
                if ipfs cat --timeout=90s "/ipns/${KEY}/${FILE}" > "downloads/${FILE}.tmp" \
                   && [ -s "downloads/${FILE}.tmp" ]; then
                  mv "downloads/${FILE}.tmp" "downloads/${FILE}"
                  echo "OK: $FILE ($(wc -l < downloads/${FILE}) lines)"
                  DONE=1
                  break 2
                fi
                rm -f "downloads/${FILE}.tmp"
                sleep 10
              done
            done
            [ "$DONE" = "1" ] || echo "Could not fetch $FILE from any IPNS key"
          done
          ls -la downloads
 
      - name: Stop IPFS daemon
        if: always() && steps.install.outcome == 'success'
        run: ipfs shutdown || true
 
      - name: Show daemon log
        if: always() && hashFiles('ipfs-daemon.log') != ''
        run: tail -n 100 ipfs-daemon.log || true
 
      - name: Generate playlist
        run: python generate_playlist.py
 
      - name: Get Madrid time (multi-source)
        run: |
          URLS=(
            "https://timeapi.io/api/Time/current/zone?timeZone=Europe/Madrid"
            "https://worldtimeapi.org/api/timezone/Europe/Madrid"
          )
      
          for URL in "${URLS[@]}"; do
            RESPONSE=$(curl -s --fail --max-time 20 "$URL") && break
          done
      
          if echo "$RESPONSE" | jq -e '.dateTime' > /dev/null 2>&1; then
            MADRID_TIME=$(jq -r '.dateTime | split(".")[0] | gsub("T"; " ")' <<< "$RESPONSE")
          elif echo "$RESPONSE" | jq -e '.datetime' > /dev/null 2>&1; then
            MADRID_TIME=$(jq -r '.datetime | split(".")[0] | gsub("T"; " ")' <<< "$RESPONSE")
          else
            echo "All APIs failed, fallback to UTC"
            MADRID_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          fi
      
          echo "MADRID_TIME=$MADRID_TIME" >> $GITHUB_ENV
 
      - name: Commit & push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add output/updated_playlist.m3u cache/
          git commit -m "Auto update playlist - $MADRID_TIME" || echo "No changes"
          git pull --rebase origin main
          git push
 
